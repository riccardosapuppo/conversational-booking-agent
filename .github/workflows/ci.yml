name: CI
on:
  push:
  pull_request:
  # Once a week as well, with nothing pushed. Three tests here were laid out
  # from today with their clock stopped in September, and went red three weeks
  # later without a commit: a check that only runs when somebody pushes cannot
  # see a repository going stale while nobody does.
  schedule:
    - cron: "17 6 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    # A job that hangs stays yellow for hours and nobody looks at it; one that
    # fails sends an email.
    timeout-minutes: 15

    # The README says "Python 3.10 or newer". Running both ends of that makes
    # it a fact rather than a claim: 3.10 is the oldest the dependencies allow,
    # and it is the one nobody develops on, so it is the one that breaks.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      # A hundred calls, each with what should have happened at the end of it,
      # scored as pass, miss or harm against two thresholds kept next to the
      # cases. Below either, this step fails, and so does harm in a call that
      # is not marked critical. The results are kept as JSON for a month.
      - name: The golden calls
        run: |
          python -m tools.evals
          python -m tools.evals --json > golden-${{ matrix.python-version }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-${{ matrix.python-version }}
          path: golden-${{ matrix.python-version }}.json
          retention-days: 30
          if-no-files-found: error

      # The same hundred calls through the reader that asks a model, with no
      # model and no network: the answers a real one gave on the day it was
      # measured, looked up by the exact request that got each of them. It
      # fails unless every verdict comes out as recorded, and a request that
      # was never recorded, as after a prompt changed by a word, is an error.
      - name: The golden calls, read by a model, replayed
        run: python -m tools.evals --replay evals/models/qwen2.5-3b.json

      # The MCP server, through the SDK's own client: over the protocol in
      # memory, and as the process a model host starts. These are in the tests
      # above too; on their own here, so a red one says which door it was.
      - name: The MCP server, through a client of the protocol
        run: python -m unittest tests.test_mcp -v

      # The tests were written alongside the code they test, so they are good
      # at saying it still does what it did. These are whole conversations,
      # and they fail if any of them goes round in circles.
      - name: Whole conversations
        run: python -m tools.transcripts

      # A whole telephone call, from the ring to the booking, translated out of
      # a switchboard's own messages. No line, no number and no account: the
      # messages are a file, and the appointment at the end of it is real.
      - name: A whole call down a telephone line
        run: python -m tools.telephone

      # It has to start, not just import. A service that only works under a
      # test client is a service nobody can run.
      - name: The service starts and answers
        run: |
          python -m booking_agent.service --port 8123 &
          for attempt in $(seq 30); do
            curl -sf http://127.0.0.1:8123/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8123/health
